server {
    listen 80;
    client_max_body_size 96k;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
    location = /api/google/callback {
        access_log off;
        proxy_pass http://backend:8000;
    }
    location = /api/voice/transcribe {
        client_max_body_size 12m;
        proxy_read_timeout 135s;
        proxy_pass http://backend:8000;
    }
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 240s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
